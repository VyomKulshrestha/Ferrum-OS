name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every multi-command step sets $PSNativeCommandUseErrorActionPreference: without it PowerShell reports
# only the exit code of a step's last command, and a failing check in the middle of a step would pass.
jobs:
  build:
    name: Build kernel + userland
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence provenance resolves dated source and audit commits.
          fetch-depth: 0

      - name: Set up Python for generated evidence checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public evidence tooling
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 numpy==2.2.6 ruff==0.15.21
        shell: pwsh

      - name: Verify public benchmark and capability evidence
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/generate_public_evidence.py --check
          python scripts/verify_public_json_schemas.py
          python scripts/verify_public_evidence_contract.py
          python scripts/verify_qemu_command_evidence.py
          python scripts/verify_repository_discovery.py
          python -m py_compile scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
        shell: pwsh

      - name: Lint public evidence tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ruff check scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
          ruff format --check scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
        shell: pwsh

      - name: Verify cyber-physical and neural safety contracts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path userland/physical-runtime/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path userland/neural-protocol/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path userland/heliox-gate-tests/Cargo.toml --target x86_64-pc-windows-msvc
          python -m unittest discover -s tools/neurod -p "test_*.py"
          python -m unittest tools.physical_sim_bridge.test_bridge
          python scripts/verify_physical_incident_sources.py
          python scripts/verify_physical_incident_dataset.py
          python scripts/verify_physical_jepa_v3_protocol.py
          python scripts/verify_physical_stress_scenarios.py
          python scripts/verify_physical_world_model.py --quick
          python scripts/verify_physical_jepa_robustness.py
          python scripts/verify_physical_simulation_caution.py
          python scripts/verify_physical_deployment_qualification.py
          python scripts/evaluate_neural_simulator.py --output target/neural-simulator-ci.json
          python -m py_compile tools/neurod/neurod.py tools/neurod/dashboard.py tools/physical_sim_bridge/protocol.py tools/physical_sim_bridge/bridge.py scripts/physical_incident_scenarios.py scripts/physical_stress_scenarios.py scripts/physical_qualification_scenarios.py scripts/select_physical_incident_jepa.py scripts/evaluate_physical_jepa_v3_baselines.py scripts/promote_physical_jepa_v3.py scripts/verify_physical_jepa_v3_protocol.py scripts/verify_physical_stress_scenarios.py scripts/verify_physical_simulation_caution.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py scripts/evaluate_physical_deployment_qualification.py scripts/calibrate_physical_jepa_runtime.py scripts/verify_physical_deployment_qualification.py scripts/evaluate_neural_simulator.py
        shell: pwsh

      - name: Lint physical incident evidence tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ruff check scripts/physical_incident_scenarios.py scripts/physical_stress_scenarios.py scripts/physical_qualification_scenarios.py scripts/select_physical_incident_jepa.py scripts/evaluate_physical_jepa_v3_baselines.py scripts/promote_physical_jepa_v3.py scripts/verify_physical_jepa_v3_protocol.py scripts/verify_physical_stress_scenarios.py scripts/verify_physical_simulation_caution.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py scripts/evaluate_physical_deployment_qualification.py scripts/calibrate_physical_jepa_runtime.py scripts/verify_physical_deployment_qualification.py
          ruff format --check scripts/physical_incident_scenarios.py scripts/physical_stress_scenarios.py scripts/physical_qualification_scenarios.py scripts/select_physical_incident_jepa.py scripts/evaluate_physical_jepa_v3_baselines.py scripts/promote_physical_jepa_v3.py scripts/verify_physical_jepa_v3_protocol.py scripts/verify_physical_stress_scenarios.py scripts/verify_physical_simulation_caution.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py scripts/evaluate_physical_deployment_qualification.py scripts/calibrate_physical_jepa_runtime.py scripts/verify_physical_deployment_qualification.py
        shell: pwsh

      # Tests of the analysis code behind the research papers (fi1). They use synthetic inputs and files
      # tracked in git; no dataset is needed.
      - name: Analysis pipeline tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check pytest==9.2.0 scipy==1.15.3 scikit-learn==1.9.1 lightgbm==4.6.0 pandas==2.2.3
          Push-Location scripts
          python -m pytest -q test_fi1_pipeline.py test_fi1_pipeline2.py test_fi1_pipeline3.py test_repro_env.py test_fi1_monitor_v3.py test_fi1_monitor_v4.py test_real_telemetry_detect_v2.py test_threshold_online_v2.py test_threshold_rules_tt1c_v2.py test_tt1d_data_v2.py
          Pop-Location
          ruff check scripts/test_fi1_pipeline.py scripts/test_fi1_pipeline2.py scripts/test_fi1_pipeline3.py scripts/test_repro_env.py scripts/repro_env.py scripts/fi1_rt_calibration_check.py scripts/physical_jepa_threshold_choice_v2.py scripts/tt1d_final_v2.py scripts/real_telemetry_core_v2.py scripts/fi1_tt1_g2_cluster_check.py scripts/fi1_gpd_cold_check.py scripts/tw1_adapters.py scripts/tw1a_score_level_dev.py
          ruff format --check scripts/test_fi1_pipeline.py scripts/test_fi1_pipeline2.py scripts/test_fi1_pipeline3.py scripts/test_repro_env.py scripts/repro_env.py scripts/fi1_rt_calibration_check.py scripts/physical_jepa_threshold_choice_v2.py scripts/tt1d_final_v2.py scripts/real_telemetry_core_v2.py scripts/fi1_tt1_g2_cluster_check.py scripts/fi1_gpd_cold_check.py scripts/tw1_adapters.py scripts/tw1a_score_level_dev.py
        shell: pwsh

      - name: Install LLVM (clang/llvm-ar for heliox-daemon's C deps)
        # windows-latest ships an older LLVM pre-installed, which a plain
        # `choco install llvm` treats as "already installed" and silently
        # keeps - that older clang linked `ring`'s C sources (curve25519,
        # p256-nistz, sha2 asm variants) into an archive missing symbols
        # the Rust side still called, failing at link time. Forcing the
        # exact version this repo is actually built and verified against
        # locally removes that as a variable entirely.
        run: choco install llvm --version=22.1.7 -y --force --no-progress
        shell: pwsh

      - name: Show toolchain (rustup reads rust-toolchain.toml automatically)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup show
          rustc --version
          clang --version
        shell: pwsh

      - name: Generate mock model fixtures (userland/init embeds these via include_bytes!)
        run: node scripts/generate_mock_model.mjs
        shell: pwsh

      - name: Build
        run: cargo build
        shell: pwsh

      # The ring-3 and syscall harnesses (scripts/verify_*.mjs) boot this image in QEMU. Keeping it as
      # an artifact lets a pull request be booted on a machine that cannot link the kernel itself.
      - name: Build the boot image
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install bootimage --version 0.10.4 --locked
          cargo bootimage
        shell: pwsh

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: bootimage-ferrumos
          path: target/x86_64-unknown-none/debug/bootimage-ferrumos.bin
          retention-days: 7
          if-no-files-found: error
