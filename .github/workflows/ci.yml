name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build kernel + userland
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence provenance resolves dated source and audit commits.
          fetch-depth: 0

      - name: Set up Python for generated evidence checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public evidence tooling
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 numpy==2.2.6 ruff==0.15.21
        shell: pwsh

      - name: Verify public benchmark and capability evidence
        run: |
          python scripts/generate_public_evidence.py --check
          python scripts/verify_public_json_schemas.py
          python scripts/verify_public_evidence_contract.py
          python scripts/verify_qemu_command_evidence.py
          python scripts/verify_repository_discovery.py
          python -m py_compile scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
        shell: pwsh

      - name: Lint public evidence tooling
        run: |
          ruff check scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
          ruff format --check scripts/generate_public_evidence.py scripts/verify_public_json_schemas.py scripts/verify_public_evidence_contract.py scripts/verify_qemu_command_evidence.py scripts/verify_repository_discovery.py
        shell: pwsh

      - name: Verify cyber-physical and neural safety contracts
        run: |
          cargo test --manifest-path userland/physical-runtime/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path userland/neural-protocol/Cargo.toml --target x86_64-pc-windows-msvc
          python -m unittest discover -s tools/neurod -p "test_*.py"
          python -m unittest tools.physical_sim_bridge.test_bridge
          python scripts/verify_physical_incident_sources.py
          python scripts/verify_physical_incident_dataset.py
          python scripts/verify_physical_world_model.py --quick
          python scripts/verify_physical_jepa_robustness.py
          python scripts/evaluate_neural_simulator.py --output target/neural-simulator-ci.json
          python -m py_compile tools/neurod/neurod.py tools/neurod/dashboard.py tools/physical_sim_bridge/protocol.py tools/physical_sim_bridge/bridge.py scripts/physical_incident_scenarios.py scripts/select_physical_incident_jepa.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py scripts/evaluate_neural_simulator.py
        shell: pwsh

      - name: Lint physical incident evidence tooling
        run: |
          ruff check scripts/physical_incident_scenarios.py scripts/select_physical_incident_jepa.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py
          ruff format --check scripts/physical_incident_scenarios.py scripts/select_physical_incident_jepa.py scripts/promote_physical_incident_evidence.py scripts/analyze_physical_jepa_false_negatives.py scripts/verify_physical_incident_sources.py scripts/verify_physical_incident_dataset.py scripts/verify_physical_world_model.py scripts/evaluate_physical_jepa_robustness.py scripts/verify_physical_jepa_robustness.py
        shell: pwsh

      - name: Install LLVM (clang/llvm-ar for heliox-daemon's C deps)
        # windows-latest ships an older LLVM pre-installed, which a plain
        # `choco install llvm` treats as "already installed" and silently
        # keeps - that older clang linked `ring`'s C sources (curve25519,
        # p256-nistz, sha2 asm variants) into an archive missing symbols
        # the Rust side still called, failing at link time. Forcing the
        # exact version this repo is actually built and verified against
        # locally removes that as a variable entirely.
        run: choco install llvm --version=22.1.7 -y --force --no-progress
        shell: pwsh

      - name: Show toolchain (rustup reads rust-toolchain.toml automatically)
        run: |
          rustup show
          rustc --version
          clang --version
        shell: pwsh

      - name: Generate mock model fixtures (userland/init embeds these via include_bytes!)
        run: node scripts/generate_mock_model.mjs
        shell: pwsh

      - name: Build
        run: cargo build
        shell: pwsh
